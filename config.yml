backend:
  name: github
  repo: ngugipeter-git/projectmedical
  branch: main

local_backend: false
publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"
show_preview_links: false

site_url: https://mwikimodernmedicalcentre.co.ke
display_url: https://mwikimodernmedicalcentre.co.ke

collections:
  - name: "site_settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/site.json"
        label: "Site Settings"
        name: "site"
        description: "Update the public contact details, opening hours, and social links."
        fields:
          - { label: "Site Name", name: "name", widget: "string", required: true }
          - { label: "Tagline", name: "tagline", widget: "string", required: true }
          - { label: "Phone", name: "phone", widget: "string", required: true }
          - { label: "Phone Link", name: "phone_link", widget: "string", required: true }
          - { label: "Email", name: "email", widget: "string", required: true }
          - { label: "Address", name: "address", widget: "string", required: true }
          - { label: "Opening Hours", name: "opening_hours", widget: "string", required: true }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "WhatsApp Number", name: "whatsapp_number", widget: "string", required: false }

  - name: "home"
    label: "Home Page"
    folder: "content/home"
    create: false
    delete: false
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Hero Title", name: "title", widget: "string", required: true }
      - { label: "Hero Subtitle", name: "subtitle", widget: "text", required: true }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false }
      - { label: "Hero Image Alt Text", name: "hero_image_alt", widget: "string", required: false }
      - { label: "Call to Action Text", name: "cta_text", widget: "string", required: true }
      - { label: "Call to Action Link", name: "cta_link", widget: "string", required: true }

  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Service Name", name: "title", widget: "string", required: true }
      - { label: "Short Description", name: "description", widget: "text", required: true }
      - { label: "Service Image", name: "image", widget: "image", required: false }
      - { label: "Page Content", name: "body", widget: "markdown", required: false }

  - name: "departments"
    label: "Departments"
    folder: "content/departments"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Department Name", name: "title", widget: "string", required: true }
      - { label: "Short Description", name: "description", widget: "text", required: true }
      - { label: "Department Image", name: "image", widget: "image", required: false }
      - { label: "Page Content", name: "body", widget: "markdown", required: false }

  - name: "faqs"
    label: "Frequently Asked Questions"
    folder: "content/faqs"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{question}}"
    fields:
      - { label: "Question", name: "question", widget: "string", required: true }
      - { label: "Answer", name: "answer", widget: "text", required: true }

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}}"
    fields:
      - { label: "Patient Name", name: "name", widget: "string", required: true }
      - { label: "Testimonial", name: "quote", widget: "text", required: true }
      - { label: "Rating", name: "rating", widget: "number", required: false, min: 1, max: 5 }

  - name: "pages"
    label: "Other Pages"
    folder: "content/pages"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: true }
      - { label: "Page Content", name: "body", widget: "markdown", required: true }

# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: NgugiPeter-git/projectmedical
  branch: main
  identity_url: https://auth.decapbridge.com/sites/33d71ef7-f849-48ab-b5c0-aa8e0f9687f7
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://mwikimodernmedicalcentre.co.ke
backend:
  name: git-gateway
  repo: NgugiPeter-git/projectmedical
  branch: main
  identity_url: https://auth.decapbridge.com/sites/33d71ef7-f849-48ab-b5c0-aa8e0f9687f7
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

local_backend: false
publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"
show_preview_links: false
site_url: https://mwikimodernmedicalcentre.co.ke
display_url: https://mwikimodernmedicalcentre.co.ke
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

collections:
  - name: "site_settings"
    label: "Site Settings"
    delete: false
    files:
      - file: "content/site.json"
        label: "Contact & Branding"
        name: "site"
        fields:
          - { label: "Site Name", name: "name", widget: "string", required: true }
          - { label: "Phone Number", name: "phone", widget: "string", required: true }
          - { label: "Phone Link (international format)", name: "phone_link", widget: "string", required: true }
          - { label: "Email", name: "email", widget: "string", required: true }
          - { label: "Address", name: "address", widget: "string", required: true }
          - { label: "Opening Hours", name: "opening_hours", widget: "string", required: true }
          - { label: "WhatsApp Number (digits only, country code first)", name: "whatsapp_number", widget: "string", required: true }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "Footer Description", name: "footer_blurb", widget: "text", required: true }

  - name: "home"
    label: "Home Page"
    delete: false
    files:
      - file: "content/home.json"
        label: "Home Page Content"
        name: "home"
        fields:
          - { label: "Hero Heading", name: "hero_title", widget: "string", required: true }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text", required: true }
          - { label: "Appointment Button Text", name: "cta_text", widget: "string", required: true }
          - { label: "Appointment Button Link", name: "cta_link", widget: "string", required: true }
          - label: "Slideshow"
            name: "slides"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Caption", name: "title", widget: "string", required: true }
              - { label: "Image", name: "image", widget: "image", required: true }
              - { label: "Image Description", name: "alt", widget: "string", required: true }
          - { label: "FAQ Section Heading", name: "faq_title", widget: "string", required: true }
          - label: "Frequently Asked Questions"
            name: "faqs"
            widget: "visual-list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string", required: true }
              - { label: "Answer", name: "answer", widget: "text", required: true }
          - { label: "Reviews Section Heading", name: "reviews_title", widget: "string", required: true }
          - label: "Patient Reviews"
            name: "testimonials"
            widget: "visual-list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Patient Name", name: "name", widget: "string", required: true }
              - { label: "Review", name: "quote", widget: "text", required: true }
              - { label: "Rating (1–5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, required: true }

  - name: "services"
    label: "Services"
    delete: false
    files:
      - file: "content/services.json"
        label: "Services Page"
        name: "services"
        fields:
          - { label: "Page Heading", name: "page_title", widget: "string", required: true }
          - { label: "Page Introduction", name: "page_subtitle", widget: "text", required: true }
          - { label: "Appointment Section Heading", name: "cta_title", widget: "string", required: true }
          - { label: "Appointment Section Text", name: "cta_text", widget: "text", required: true }
          - label: "Services"
            name: "items"
            widget: "visual-list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Service Name", name: "title", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "text", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Stethoscope", value: "fas fa-stethoscope" }
                  - { label: "Heart", value: "fas fa-heart" }
                  - { label: "Pills", value: "fas fa-pills" }
                  - { label: "Baby", value: "fas fa-baby" }
                  - { label: "Lungs", value: "fas fa-lungs" }
                  - { label: "Microscope", value: "fas fa-microscope" }
                  - { label: "Tooth", value: "fas fa-tooth" }
                  - { label: "Eye", value: "fas fa-eye" }
                  - { label: "Hospital", value: "fas fa-hospital" }
                  - { label: "Doctor", value: "fas fa-user-md" }
              - { label: "Contact Form Service ID", name: "slug", widget: "string", required: true }

  - name: "departments"
    label: "Departments"
    delete: false
    files:
      - file: "content/departments.json"
        label: "Departments Page"
        name: "departments"
        fields:
          - { label: "Page Heading", name: "page_title", widget: "string", required: true }
          - { label: "Page Introduction", name: "page_subtitle", widget: "text", required: true }
          - label: "Departments"
            name: "items"
            widget: "visual-list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Department Name", name: "title", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "text", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Stethoscope", value: "fas fa-stethoscope" }
                  - { label: "Heart", value: "fas fa-heart" }
                  - { label: "Baby", value: "fas fa-baby" }
                  - { label: "Hospital", value: "fas fa-hospital" }
                  - { label: "Medical Staff", value: "fas fa-user-md" }

  - name: "about"
    label: "About Page"
    delete: false
    files:
      - file: "content/about.json"
        label: "About Page Content"
        name: "about"
        fields:
          - { label: "Page Heading", name: "page_title", widget: "string", required: true }
          - { label: "Page Subtitle", name: "page_subtitle", widget: "string", required: true }
          - { label: "Introduction Heading", name: "intro_heading", widget: "string", required: true }
          - label: "Introduction Paragraphs"
            name: "intro_paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text", required: true }
          - { label: "Mission", name: "mission", widget: "text", required: true }
          - { label: "Vision", name: "vision", widget: "text", required: true }
          - { label: "Values", name: "values", widget: "text", required: true }
          - { label: "Why Choose Us Heading", name: "features_title", widget: "string", required: true }
          - label: "Reasons to Choose Us"
            name: "features"
            widget: "visual-list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "text", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Doctor", value: "fas fa-user-md" }
                  - { label: "Hospital", value: "fas fa-hospital" }
                  - { label: "Clock", value: "fas fa-clock" }
                  - { label: "Smile", value: "fas fa-smile" }
                  - { label: "Shield", value: "fas fa-shield-alt" }
                  - { label: "Handshake", value: "fas fa-handshake" }
          - { label: "Team Section Heading", name: "team_title", widget: "string", required: true }
          - { label: "Team Section Subtitle", name: "team_subtitle", widget: "text", required: true }
          - label: "Team Members"
            name: "team"
            widget: "visual-list"
            summary: "{{fields.name}} — {{fields.title}}"
            fields:
              - { label: "Name", name: "name", widget: "string", required: true }
              - { label: "Role", name: "title", widget: "string", required: true }
              - { label: "Biography", name: "bio", widget: "text", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Doctor", value: "fas fa-user-doctor" }
                  - { label: "Nurse", value: "fas fa-user-nurse" }
                  - { label: "Medical Staff", value: "fas fa-user-md" }
          - { label: "Call to Action Heading", name: "cta_title", widget: "string", required: true }
          - { label: "Call to Action Text", name: "cta_text", widget: "text", required: true }

  - name: "contact"
    label: "Contact Page"
    delete: false
    files:
      - file: "content/contact.json"
        label: "Contact Page Content"
        name: "contact"
        fields:
          - { label: "Contact Section Heading", name: "contact_title", widget: "string", required: true }
          - label: "Contact Cards"
            name: "contact_cards"
            widget: "visual-list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Heading", name: "title", widget: "string", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Phone", value: "fas fa-phone" }
                  - { label: "Email", value: "fas fa-envelope" }
                  - { label: "WhatsApp", value: "fab fa-whatsapp" }
                  - { label: "Location", value: "fas fa-map-marker-alt" }
                  - { label: "Clock", value: "fas fa-clock" }
              - { label: "Displayed Details", name: "detail", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "string", required: true }
              - { label: "Link URL", name: "href", widget: "string", required: false }
          - { label: "Message Form Heading", name: "form_title", widget: "string", required: true }
          - { label: "Send Button Text", name: "submit_text", widget: "string", required: true }
          - { label: "Appointment Section Heading", name: "appointment_title", widget: "string", required: true }
          - { label: "Appointment Section Text", name: "appointment_text", widget: "text", required: true }
          - label: "Appointment Methods"
            name: "appointment_methods"
            widget: "visual-list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Heading", name: "title", widget: "string", required: true }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Phone", value: "fas fa-phone" }
                  - { label: "Email", value: "fas fa-envelope" }
                  - { label: "WhatsApp", value: "fab fa-whatsapp" }
                  - { label: "Calendar", value: "fas fa-calendar-check" }
              - { label: "Description", name: "description", widget: "text", required: true }
              - { label: "Button Text", name: "button_text", widget: "string", required: true }
              - { label: "Button URL", name: "href", widget: "string", required: true }
          - { label: "Map Section Heading", name: "map_title", widget: "string", required: true }
          - { label: "Map Section Text", name: "map_text", widget: "string", required: true }
          - { label: "Google Maps Embed URL", name: "map_embed_url", widget: "string", required: true }

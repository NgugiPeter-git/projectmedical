<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>MWIKI MODERN Admin | Decap CMS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f9ff;
        color: #123;
      }
      .loader {
        text-align: center;
        padding: 2rem 2.5rem;
        border-radius: 18px;
        background: white;
        box-shadow: 0 12px 36px rgba(17, 48, 81, 0.12);
      }
      .loader img {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem auto;
      }
      .loader strong {
        display: block;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="decap-loading" class="loader">
      <img src="/images/favicon.png" alt="Loading">
      <strong>Loading Decap CMS admin...</strong>
      <span>Please wait while the editor connects to DecapBridge.</span>
    </div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        const loader = document.getElementById('decap-loading');
        if (window.CMS) {
          window.CMS.init();
          if (loader) {
            loader.querySelector('span').textContent = 'Decap CMS is ready. Sign in to continue.';
          }
        } else if (loader) {
          loader.querySelector('span').textContent = 'Decap CMS failed to load. Check the internet connection and DecapBridge settings.';
        }
      });
    </script>
  </body>
</html>
